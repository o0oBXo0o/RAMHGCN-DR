[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramhgcn"
version = "2.0.0"
description = "Reproducible implementation of the Relation-Adaptive Multiplex Heterogeneous Graph Convolutional Network"
readme = "README.md"
requires-python = ">=3.8,<3.10"
dependencies = [
  "numpy==1.21.2",
  "scipy==1.10.1",
  "pandas==1.5.3",
  "rdkit==2022.9.5",
  "scikit-learn==1.2.2",
  "torch==2.0.1",
  "PyYAML==6.0",
  "openpyxl==3.0.9",
  "tqdm==4.67.1",
]

[project.scripts]
ramhgcn = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "cli",
  "config",
  "data",
  "experiment",
  "graph_input",
  "metrics",
  "model",
  "ranking",
  "runtime",
  "similarity",
  "splits",
  "training",
]

[tool.setuptools.packages.find]
where = ["src"]
